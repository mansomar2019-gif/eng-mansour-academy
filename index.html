<body class="bg-darkBg text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
(function () {
  const { useState, useEffect, useRef } = React;
  const IMG = window.AMC_IMG || {};
  const Sec = ({ id, title, sub, children }) => (
    <section id={id} className="amc-sec max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 space-y-8">
      <div><h3 className="text-2xl sm:text-3xl font-black text-white">{title}</h3>{sub && <p className="text-sm text-slate-400 mt-1">{sub}</p>}</div>
      {children}
    </section>
  );

  function Stats({ courseCount }) {
    const items = [{ v: "108,240", l: "views على قناة YouTube" }, { v: String(courseCount == null ? 0 : courseCount), l: "كورسات متاحة حاليًا" }];
    return (
      <section className="amc-sec max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div className="grid grid-cols-2 gap-2 sm:gap-4 max-w-md mx-auto">
          {items.map(i => (
            <div key={i.l} className="bg-cardBg border border-slate-800 rounded-3xl p-3 sm:p-5 text-center">
              <div className="text-2xl min-[420px]:text-3xl sm:text-4xl font-black text-accent">{i.v}</div>
              <div className="text-[11px] min-[420px]:text-xs sm:text-sm text-slate-400 mt-1 leading-snug">{i.l}</div>
            </div>
          ))}
        </div>
      </section>
    );
  }

  /* ================= فيديو الترحيب (منفصل تماماً عن فيديوهات الدروس) =================
     لتغيير الفيديو مستقبلاً: غيّر المتغير التالي فقط (ID الفيديو أو رابط YouTube كامل).
     لو سبته فاضي هيظهر Placeholder أنيق بدل المشغل. */
  const WELCOME_VIDEO_ID = "";

  function WelcomeVideo() {
    const raw = String(WELCOME_VIDEO_ID || "").trim();
    const m = raw.match(/(?:youtu\.be\/|v\/|embed\/|watch\?v=|&v=|shorts\/)([A-Za-z0-9_-]{11})/);
    const vid = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(raw) ? raw : "");
    return (
      <section id="welcome-video" className="amc-sec max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div className="max-w-3xl mx-auto text-center space-y-3 mb-6">
          <h3 className="text-2xl sm:text-3xl font-black text-white">أهلاً بيك يا مبرمج المستقبل</h3>
          <p className="text-sm sm:text-base text-slate-400 leading-relaxed">شوف الفيديو ده الأول، وهتعرف المنصة بتقدملك إيه وازاي تبدأ رحلتك في البرمجة والذكاء الاصطناعي.</p>
        </div>
        <div className="max-w-3xl mx-auto bg-cardBg border border-slate-800 rounded-3xl p-3 sm:p-4 shadow-2xl shadow-accent/10">
          <div className="video-wrapper border border-slate-800">
            {vid ? (
              <iframe
                src={"https://www.youtube.com/embed/" + vid + "?rel=0&modestbranding=1"}
                title="أهلاً بيك يا مبرمج المستقبل"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerPolicy="strict-origin-when-cross-origin"
                allowFullScreen
              ></iframe>
            ) : (
              <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-slate-900 text-center px-4">
                <span className="text-4xl">▶️</span>
                <p className="text-sm sm:text-base font-bold text-white">فيديو الترحيب هيتضاف قريب</p>
                <p className="text-xs text-slate-400">هتقدر تشغّله من هنا من غير تسجيل دخول أول ما يتم رفعه</p>
              </div>
            )}
          </div>
        </div>
      </section>
    );

                localStorage.setItem("mansour_courses_v3", JSON.stringify(courses));
            }, [courses]);

            // حذف المفتاح القديم نهائيًا: لم يعد له أي دور في الصلاحيات
            useEffect(() => {
                try { localStorage.removeItem("mansour_unlocked_items_v3"); } catch (e) {}
            }, []);

            // اشتراكات الطالب الحالي فقط (استعلام مقيّد بـ studentUID، والقواعد تتحقق منه)
            const uid = user ? user.uid : null;
            useEffect(() => {
                setUnlockedItems([]);
                setLessonContent({});
                if (!uid || !window.firebaseModules) return;
                let unsubscribe = () => {};
                try {
                    const { initializeApp, getFirestore, collection, query, where, onSnapshot } = window.firebaseModules;
                    const db = getFirestore(initializeApp(firebaseConfig));
                    unsubscribe = onSnapshot(
                        query(collection(db, "enrollments"), where("studentUID", "==", uid)),
                        (snap) => {
                            const ids = [];
                            snap.forEach(d => { const e = d.data(); if (e && e.active === true && e.courseId) ids.push(e.courseId); });
                            setUnlockedItems(ids);
                        },
                        () => setUnlockedItems([])
                    );
                } catch (err) { setUnlockedItems([]); }
                return () => { unsubscribe(); setUnlockedItems([]); setLessonContent({}); };
            }, [uid]);

            // محتوى الحصة (videoId/pdfUrl) يُجلب من lessonContent؛ القواعد تشترط مجانية الحصة أو وجود اشتراك
            useEffect(() => {
                if (!activeLesson || !window.firebaseModules) return;
                const permitted = activeLesson.isFree || (activeCourse && isItemUnlocked(activeCourse.id, activeLesson.id));
                if (!permitted || lessonContent[activeLesson.id]) return;
                let cancelled = false;
                (async () => {
                    try {
                        const { initializeApp, getFirestore, doc, getDoc } = window.firebaseModules;
                        const db = getFirestore(initializeApp(firebaseConfig));
                        const snap = await getDoc(doc(db, "lessonContent", activeLesson.id));
                        if (!cancelled && snap.exists()) setLessonContent(prev => ({ ...prev, [activeLesson.id]: snap.data() }));
                    } catch (e) { /* بلا تفاصيل للمستخدم */ }
                })();
                return () => { cancelled = true; };
            }, [activeLesson, activeCourse, unlockedItems, uid]);

            // دمج بيانات الحصة العامة مع محتواها المحمي (أو البيانات المضمنة القديمة قبل الترحيل)
            const contentOf = (lesson) => ({ ...(lesson || {}), ...(lessonContent[lesson && lesson.id] || {}) });

            const isItemUnlocked = (courseId, lessonId) => {
                if (unlockedItems.includes("ALL") || unlockedItems.includes(courseId)) return true;
                if (lessonId && unlockedItems.includes(lessonId)) return true;
                return false;
            };

            // تفعيل الكود: قراءة مستند الكود المُدخل فقط + معاملة ذرية (لا يتم تحميل قائمة الأكواد)
            const handleActivateCode = async (e) => {
                e.preventDefault();
                const cleaned = codeInput.trim().toUpperCase();
                if (!cleaned) {
                    setCodeMessage({ type: "error", text: "يرجى كتابة كود التفعيل" });
                    return;
                }
                if (!user) {
                    setCodeMessage({ type: "error", text: "🔐 سجّل دخولك بحساب جوجل أولاً (زر «دخول بجوجل» بالأعلى) ثم أدخل الكود." });
                    return;
                }
                const GENERIC_FAIL = "❌ كود غير صالح أو مستخدم من قبل. تأكد من كتابته بشكل سليم أو تواصل مع المهندس منصور.";
                if (!/^MF-[0-9A-F]{32}$/.test(cleaned)) {
                    setCodeMessage({ type: "error", text: GENERIC_FAIL });
                    return;
                }

                setIsFirebaseSyncing(true);
                try {
                    const { initializeApp, getFirestore, doc, runTransaction, serverTimestamp } = window.firebaseModules || {};
                    const db = getFirestore(initializeApp(firebaseConfig));
                    const ref = doc(db, "codes", cleaned);

                    // معاملة ذرية: استهلاك الكود + إنشاء الاشتراك معًا أو لا شيء
                    await runTransaction(db, async (tx) => {
                        const snap = await tx.get(ref);
                        if (!snap.exists()) throw new Error("INVALID");
                        const data = snap.data();
                        if (data.used !== false || !data.targetId) throw new Error("INVALID");
                        tx.update(ref, { used: true, usedAt: serverTimestamp(), usedBy: user.uid });
                        tx.set(doc(db, "enrollments", user.uid + "_" + data.targetId), {
                            studentUID: user.uid,
                            courseId: data.targetId,
                            active: true,
                            activatedAt: serverTimestamp(),
                            codeId: cleaned
                        });
                    });

                    // لا نكتب أي صلاحية محليًا: المستمع على enrollments يحدّث الواجهة تلقائيًا
                    setCodeMessage({ type: "success", text: "🎉 تم التفعيل بنجاح! تم فتح المحتوى لك على حسابك." });
                    setCodeInput("");
                    setTimeout(() => {
                        setShowPaymentModal(false);
                        setCodeMessage({ type: "", text: "" });
                    }, 1700);

                } catch (err) {
                    // رسالة عامة دائمًا: لا نكشف هل الكود غير موجود أم مستخدم أم مرفوض
                    if (err && (err.message === "INVALID" || err.code === "permission-denied" || err.code === "aborted" || err.code === "failed-precondition")) {
                        setCodeMessage({ type: "error", text: "❌ كود غير صالح أو مستخدم من قبل. تأكد من كتابته بشكل سليم أو تواصل مع المهندس منصور." });
                    } else {
                        setCodeMessage({ type: "error", text: "حدث خطأ في الاتصال. يرجى مراجعة اتصال الإنترنت." });
                    }
                } finally {
                    setIsFirebaseSyncing(false);
                }
            };

            // توليد الأكواد
            // يفصل بيانات الحصة العامة عن محتواها المحمي (videoId/pdfUrl) ويحفظ الاثنين (للمدير فقط)
            const saveCourseSecure = async (course) => {
                const { getFirestore, doc, setDoc, initializeApp } = window.firebaseModules;
                const db = getFirestore(initializeApp(firebaseConfig));
                const publicLessons = [];
                for (const l of (course.lessons || [])) {
                    if (l.videoId || l.pdfUrl) {
                        await setDoc(doc(db, "lessonContent", l.id), {
                            courseId: course.id, lessonId: l.id, isFree: !!l.isFree,
                            videoId: l.videoId || "", pdfUrl: l.pdfUrl || ""
                        });
                    }
                    if (l.isFree) publicLessons.push(l);
                    else { const { videoId, pdfUrl, ...rest } = l; publicLessons.push(rest); }
                }
                await setDoc(doc(db, "courses", course.id), { ...course, lessons: publicLessons });
            };

            // المراحل المتاحة عند إنشاء كورس: المراحل الأساسية + أي مرحلة موجودة في الكورسات الحالية
            const courseStageOptions = [...new Set(["الصف الأول الثانوي", "الصف الثاني الثانوي - بكالوريا", "تأسيس البرمجة", ...courses.map(c => c.stage).filter(Boolean)])];

            // إنشاء كورس جديد: معرّف تلقائي فريد (لا يعتمد على الاسم) + حفظ في Firestore للمدير فقط
            const handleCreateCourse = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                if (creatingCourse) return;
                if (!isAdmin) { alert("هذه العملية للمدير فقط."); return; }
                if (!window.firebaseModules) { alert("تعذر الاتصال بـ Firebase. حدّث الصفحة وحاول مرة أخرى."); return; }
                const title = courseDraft.title.trim();
                const stage = (courseDraft.stage === "__custom__" ? courseDraft.customStage : courseDraft.stage).trim();
                const priceRaw = String(courseDraft.price).trim();
                const price = Number(priceRaw);
                const thumb = courseDraft.thumbnail.trim();
                if (!title) { alert("اكتب اسم الكورس."); return; }
                if (!stage) { alert("اختر المرحلة الدراسية."); return; }
                if (priceRaw === "" || !Number.isFinite(price) || price < 0) { alert("اكتب سعرًا صحيحًا (رقم أكبر من أو يساوي صفر)."); return; }
                if (thumb && !/^https?:\/\//i.test(thumb)) { alert("رابط صورة الغلاف يجب أن يبدأ بـ http:// أو https://"); return; }
                const fallbackThumb = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101C14"/><stop offset="1" stop-color="#165f2a"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><text x="450" y="330" font-size="140" text-anchor="middle" fill="#39E75F" font-family="monospace">&lt;/&gt;</text></svg>');
                setCreatingCourse(true);
                try {
                    const { getFirestore, doc, collection, initializeApp } = window.firebaseModules;
                    const db = getFirestore(initializeApp(firebaseConfig));
                    const id = doc(collection(db, "courses")).id;
                    const created = { id, title, stage, price, thumbnail: thumb || fallbackThumb, badge: courseDraft.badge, description: courseDraft.description.trim(), lessons: [] };
                    await saveCourseSecure(created);
                    setCourses(prev => prev.some(c => c.id === id) ? prev : [...prev, created]);
                    setCourseDraft(EMPTY_NEW_COURSE);
                    setAdminTab("courses");
                    alert("✅ تم إنشاء الكورس وحفظه، وظهر للطلاب تحت مرحلته. تقدر دلوقتي تضيف له حصص وتولّد له أكواد.");
                } catch (err) {
                    console.error(err);
                    alert("تعذر إنشاء الكورس. تأكد من تسجيل الدخول بحساب المدير ونشر قواعد Firestore.");
                } finally {
                    setCreatingCourse(false);
                }
            };

            const handleGenerateCodes = async () => {
                if (!isAdmin) { alert("هذه العملية للمدير فقط."); return; }
                const newBatch = [];
                const { getFirestore, doc, setDoc, getDoc, initializeApp } = window.firebaseModules || {};
                const db = window.firebaseModules ? getFirestore(initializeApp(firebaseConfig)) : null;

                // 128-bit عشوائية حقيقية: 16 بايت من crypto.getRandomValues => 32 خانة Hex
                const newCodeString = () => {
                    const bytes = new Uint8Array(16);
                    crypto.getRandomValues(bytes);
                    return "MF-" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
                };
                let saved = 0;
                for (let i = 0; i < Number(genCount); i++) {
                    const codeStr = newCodeString();
                    const codeData = {
                        code: codeStr,
                        targetId: genTargetId,
                        used: false,
                        createdAt: new Date().toISOString()
                    };
                    newBatch.push(codeData);

                    if (db) {
                        try {
                            const ref = doc(db, "codes", codeStr);
                            if ((await getDoc(ref)).exists()) { i--; continue; } // لا تكرار
                            await setDoc(ref, codeData);
                            saved++;
                        } catch(e) { /* لا نطبع الأكواد */ }
                    }
                }
                if (saved === Number(genCount)) alert(`✅ تم توليد وحفظ ${genCount} أكواد سحابياً بنجاح!`);
                else alert(`⚠️ تم حفظ ${saved} من ${genCount} فقط. تأكد من تسجيل الدخول بحساب المدير ونشر قواعد Firestore.`);
            };

            // إضافة الحصة الشاملة الجديدة بالثامنيل والسعر والاختبار والـ PDF
            const handleAddComprehensiveLesson = async (e) => {
                e.preventDefault();
                if (!newLesson.title || !newLesson.videoUrl) {
                    alert("يرجى كتابة عنوان الحصة ورابط فيديو اليوتيوب");
                    return;
                }

                const extractedId = extractYouTubeId(newLesson.videoUrl);
                const defaultThumb = extractedId 
                    ? `https://img.youtube.com/vi/${extractedId}/maxresdefault.jpg` 
                    : "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80";

                const lessonObj = {
                    id: "lesson-" + Date.now(),
                    title: newLesson.title,
                    duration: newLesson.duration || "45 دقيقة",
                    videoId: extractedId,
                    thumbnail: newLesson.thumbnail.trim() || defaultThumb,
                    price: Number(newLesson.price) || 0,
                    isFree: newLesson.isFree,
                    pdfUrl: newLesson.pdfUrl.trim() || "https://drive.google.com/",
                    quizQuestion: newLesson.quizQuestion.trim() || "ما هي النتيجة المستفادة من تطبيق هذه الحصة؟",
                    quizOptions: [
                        newLesson.quizOpt0.trim() || "فهمت واستوعبت التطبيق العملي",
                        newLesson.quizOpt1.trim() || "أحتاج لمراجعة كتابة الكود مرة ثانية",
                        newLesson.quizOpt2.trim() || "سأطبق مع البشمهندس منصور خطوة بخطوة"
                    ],
                    correctOption: Number(newLesson.correctOpt) || 0
                };

                const updatedCourses = courses.map(c => {
                    if (c.id === newLesson.courseId) {
                        const updated = { ...c, lessons: [...c.lessons, lessonObj] };
                        if (window.firebaseModules && isAdmin) saveCourseSecure(updated).catch(() => alert("تعذر الحفظ. تأكد من تسجيل الدخول بحساب المدير ونشر القواعد."));
                        return updated;
                    }
                    return c;
                });

                setCourses(updatedCourses);
                setNewLesson({
                    courseId: newLesson.courseId,
                    title: "",
                    duration: "45 دقيقة",
                    videoUrl: "",
                    thumbnail: "",
                    price: 35,
                    pdfUrl: "",
                    isFree: false,
                    quizQuestion: "",
                    quizOpt0: "",
                    quizOpt1: "",
                    quizOpt2: "",
                    correctOpt: 0
                });

                alert("🎉 تم نشر الحصة الجديدة بالكامل وحفظها سحابياً بالثامنيل والاختبار والـ PDF!");
            };

            // حذف حصة
            const handleDeleteLesson = (courseId, lessonId) => {
                if (!confirm("هل أنت متأكد من حذف هذه الحصة؟")) return;
                const updated = courses.map(c => {
                    if (c.id === courseId) {
                        const mod = { ...c, lessons: c.lessons.filter(l => l.id !== lessonId) };
                        if (window.firebaseModules && isAdmin) saveCourseSecure(mod).catch(() => alert("تعذر الحفظ. تأكد من تسجيل الدخول بحساب المدير ونشر القواعد."));
                        return mod;
                    }
                    return c;
                });
                setCourses(updated);
            };

            const filteredCourses = selectedStage === "الكل" ? courses : courses.filter(c => c.stage === selectedStage);

            return (
                <div className="min-h-screen flex flex-col justify-between bg-darkBg text-slate-100">
                    {/* Header */}
                    <header className="sticky top-0 z-40 backdrop-blur-md bg-[#07110B]/90 border-b border-slate-800/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 sm:py-0 sm:h-20 flex flex-wrap sm:flex-nowrap items-center justify-between gap-x-2 gap-y-2">
                            <div onClick={() => { setActiveCourse(null); setAdminOpen(false); }} className="flex items-center gap-2 sm:gap-3 cursor-pointer group min-w-0 flex-1 sm:flex-none">
                                <img src={window.AMC_IMG.logo} alt="شعار مبرمج المستقبل" width="48" height="48" className="w-10 h-10 sm:w-12 sm:h-12 shrink-0 rounded-2xl object-cover ring-2 ring-accent/60 shadow-lg shadow-accent/30" />
                                <div className="min-w-0">
                                    <h1 className="text-base sm:text-xl font-black tracking-tight text-white flex items-center gap-2">
                                        <span className="truncate">{SITE_CONFIG.instructorTitle}</span>
                                        <span className="hidden min-[480px]:inline-block shrink-0 text-xs bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full">مبرمج المستقبل</span>
                                    </h1>
                                    <p className="text-[11px] sm:text-xs text-slate-400 truncate">مبرمج المستقبل | البرمجة والذكاء الاصطناعي</p>
                                </div>
                            </div>

                            <div className="contents sm:flex sm:items-center sm:gap-3">
                                {/* زر تسجيل الدخول بحساب جوجل */}
                                {user ? (
                                    <div className="order-2 sm:order-none shrink-0 flex items-center gap-2 bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-xl">
                                        <img src={user.photoURL} alt="" className="w-7 h-7 rounded-full object-cover" />
                                        <span className="text-xs font-bold text-white hidden sm:inline">{user.displayName}</span>
                                        <button 
                                            onClick={handleLogout}
                                            className="text-rose-400 hover:text-rose-300 text-xs font-bold mr-2 pr-2 border-r border-slate-700"
                                            title="تسجيل الخروج"
                                        >
                                            خروج 🚪
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={handleGoogleLogin}
                                        className="order-2 sm:order-none shrink-0 bg-white hover:bg-slate-100 text-slate-900 font-bold px-3.5 py-2.5 rounded-xl text-xs sm:text-sm shadow-md transition flex items-center gap-2"
                                    >
                                        <svg className="w-4 h-4" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.32 7.21 24 12 24z"/>
                                            <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.49-.39-2.24s.14-1.52.39-2.24V6.62H1.18C.43 8.12 0 9.8 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.21 0 3.16 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                                        </svg>
                                        <span>دخول بجوجل</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => { setTargetItemForCode(null); setShowPaymentModal(true); }}
                                    className="order-3 sm:order-none w-full sm:w-auto justify-center whitespace-nowrap bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-4 py-2 sm:py-2.5 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition flex items-center gap-2"
                                >
                                    <span>🔑</span><span>معاك كود تفعيل؟</span>
                                </button>
                                <a
                                    href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${encodeURIComponent("السلام عليكم يا بشمهندس منصور، كنت عايز أشترك في المنصة وأستلم كود التفعيل")}`}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="hidden sm:flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-2.5 rounded-xl text-sm font-bold transition"
                                >
                                    <span>💬</span><span>تواصل واتساب</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {isAdminAuthenticated ? (
                            /* لوحة الأدمن الشاملة */
                            <div className="max-w-6xl mx-auto px-4 py-10">
                                <div className="bg-cardBg border border-purple-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl">
                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-6">
                                        <div>
                                            <span className="text-xs font-bold uppercase tracking-wider bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full">لوحة الإدارة السحابية الشاملة ☁️</span>
                                            <h2 className="text-2xl font-black text-white mt-2">إدارة الحصص والكورسات يا {SITE_CONFIG.instructorTitle} 👋</h2>
                                            <p className="text-slate-400 text-sm">أضف أي حصة جديدة بكل تفاصيلها (الثامنيل، السعر المنفرد، ملزمة الـ PDF، وسؤال الاختبار التفاعلي) ومزامنتها سحابياً فوراً.</p>
                                        </div>
                                        <button onClick={() => setAdminOpen(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-bold transition">
                                            العودة لواجهة الطلاب ⬅️
                                        </button>
                                    </div>

                                    {/* تبويبات الإدارة */}
                                    <div className="flex flex-wrap gap-2 mb-8">
                                        <button onClick={() => setAdminTab("newcourse")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "newcourse" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300 hover:bg-slate-700"}`}>
                                            ➕ إنشاء كورس جديد
                                        </button>
                                        <button onClick={() => setAdminTab("lessons")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "lessons" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            🎬 إضافة حصة جديدة (شاملة الثامنيل والسعر والاختبار)
                                        </button>
                                        <button onClick={() => setAdminTab("codes")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "codes" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            🔑 توليد أكواد الكورسات والحصص ({activationCodes.length})
                                        </button>
                                        <button onClick={() => setAdminTab("courses")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "courses" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            📚 إدارة الكورسات والأسعار
                                        </button>
                                    </div>

                                    {/* 0. إنشاء كورس جديد */}
                                    {adminTab === "newcourse" && (
                                        <form onSubmit={handleCreateCourse} className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-7 space-y-6">
                                            <div className="border-b border-slate-800 pb-3">
                                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                                    <span>➕</span><span>إنشاء كورس جديد</span>
                                                </h3>
                                                <p className="text-xs text-slate-400">يُحفظ الكورس سحابياً ويظهر للطلاب فوراً تحت مرحلته، وبعدها تقدر تضيف له حصص وتولّد له أكواد.</p>
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <div className="sm:col-span-2">
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">1. اسم الكورس (إجباري):</label>
                                                    <input type="text" value={courseDraft.title} onChange={e => setCourseDraft({ ...courseDraft, title: e.target.value })} placeholder="مثال: منهج البرمجة - الصف الثالث الثانوي" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">2. المرحلة الدراسية:</label>
                                                    <select value={courseDraft.stage} onChange={e => setCourseDraft({ ...courseDraft, stage: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                                                        <option value="">— اختر المرحلة —</option>
                                                        {courseStageOptions.map(st => <option key={st} value={st}>{st}</option>)}
                                                        <option value="__custom__">➕ مرحلة جديدة...</option>
                                                    </select>
                                                    {courseDraft.stage === "__custom__" && (
                                                        <input type="text" value={courseDraft.customStage} onChange={e => setCourseDraft({ ...courseDraft, customStage: e.target.value })} placeholder="اكتب اسم المرحلة الجديدة" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 mt-2" />
                                                    )}
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">3. سعر الكورس (ج.م):</label>
                                                    <input type="number" min="0" step="1" value={courseDraft.price} onChange={e => setCourseDraft({ ...courseDraft, price: e.target.value })} placeholder="مثال: 150" className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">4. رابط صورة الغلاف:</label>
                                                    <input type="url" dir="ltr" value={courseDraft.thumbnail} onChange={e => setCourseDraft({ ...courseDraft, thumbnail: e.target.value })} placeholder="https://..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">5. الشارة التعريفية:</label>
                                                    <select value={courseDraft.badge} onChange={e => setCourseDraft({ ...courseDraft, badge: e.target.value })} className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                                                        <option value="">بدون شارة</option>
                                                        <option value="جديد ✨">جديد ✨</option>
                                                        <option value="الأكثر مبيعًا 🔥">الأكثر مبيعًا 🔥</option>
                                                        <option value="مميز ⭐">مميز ⭐</option>
                                                        <option value="عرض خاص 🎁">عرض خاص 🎁</option>
                                                    </select>
                                                </div>
                                                <div className="sm:col-span-2">
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">6. وصف الكورس:</label>
                                                    <textarea rows="3" value={courseDraft.description} onChange={e => setCourseDraft({ ...courseDraft, description: e.target.value })} placeholder="اكتب وصفًا مختصرًا يظهر للطلاب..." className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"></textarea>
                                                </div>
                                                {/^https?:\/\//i.test(courseDraft.thumbnail.trim()) && (
                                                    <div className="sm:col-span-2">
                                                        <p className="text-xs text-slate-400 mb-1.5 font-bold">معاينة الغلاف:</p>
                                                        <img src={courseDraft.thumbnail.trim()} alt="معاينة الغلاف" onError={e => { e.currentTarget.style.display = "none"; }} onLoad={e => { e.currentTarget.style.display = "block"; }} className="w-full max-w-xs h-40 object-cover rounded-2xl border border-slate-700" />
                                                    </div>
                                                )}
                                            </div>
                                            <button type="submit" disabled={creatingCourse} className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 disabled:opacity-60 disabled:cursor-not-allowed text-slate-950 font-black py-3.5 rounded-2xl text-base shadow-xl shadow-cyan-500/20 flex items-center justify-center gap-2">
                                                <span>{creatingCourse ? "⏳" : "🚀"}</span><span>{creatingCourse ? "جاري الحفظ..." : "إنشاء الكورس وحفظه سحابياً"}</span>
                                            </button>
                                        </form>
                                    )}

                                    {/* 1. نموذج إضافة حصة شاملة */}
                                    {adminTab === "lessons" && (
                                        <form onSubmit={handleAddComprehensiveLesson} className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-7 space-y-6">
                                            <div className="border-b border-slate-800 pb-3">
                                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                                    <span>➕</span><span>إضافة محاضرة جديدة متكاملة</span>
                                                </h3>
                                                <p className="text-xs text-slate-400">ستظهر المحاضرة فوراً للطلاب مع صورتها الخاصة والـ PDF وسؤال الاختبار.</p>
                                            </div>

                                            {/* البيانات الأساسية للحصة */}
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">1. الكورس التابعة له الحصة:</label>
                                                    <select
                                                        value={newLesson.courseId}
                                                        onChange={e => setNewLesson({ ...newLesson, courseId: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    >
                                                        {courses.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                                                    </select>
                                                </div>
                                                <div className="sm:col-span-2">
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">2. عنوان الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="مثال: الحصة 4: بناء أول نموذج ذكاء اصطناعي ببايثون"
                                                        value={newLesson.title}
                                                        onChange={e => setNewLesson({ ...newLesson, title: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">3. رابط فيديو يوتيوب (Unlisted):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://www.youtube.com/watch?v=..."
                                                        value={newLesson.videoUrl}
                                                        onChange={e => setNewLesson({ ...newLesson, videoUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">4. رابط ثامنيل الحصة (أو اتركه لجلب صورة يوتيوب تلقائياً):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://... رابط صورة الغلاف"
                                                        value={newLesson.thumbnail}
                                                        onChange={e => setNewLesson({ ...newLesson, thumbnail: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">5. سعر الحصة منفردة (ج.م):</label>
                                                    <input
                                                        type="number"
                                                        value={newLesson.price}
                                                        onChange={e => setNewLesson({ ...newLesson, price: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">6. رابط ملزمة الـ PDF (Google Drive):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://drive.google.com/file/d/..."
                                                        value={newLesson.pdfUrl}
                                                        onChange={e => setNewLesson({ ...newLesson, pdfUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">7. مدة الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="50 دقيقة"
                                                        value={newLesson.duration}
                                                        onChange={e => setNewLesson({ ...newLesson, duration: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <div className="flex items-center gap-3 pt-6">
                                                    <input
                                                        type="checkbox"
                                                        id="comprehensiveFreeCheck"
                                                        checked={newLesson.isFree}
                                                        onChange={e => setNewLesson({ ...newLesson, isFree: e.target.checked })}
                                                        className="w-5 h-5 accent-cyan-500"
                                                    />
                                                    <label htmlFor="comprehensiveFreeCheck" className="text-sm font-bold text-slate-200 cursor-pointer">
                                                        حصة مجانية تجريبية مفتوحة للجميع بدون كود
                                                    </label>
                                                </div>
                                            </div>

                                            {/* قسم إضافة الاختبار التفاعلي الخاص بالحصة */}
                                            <div className="bg-slate-950/70 border border-slate-800 p-5 rounded-2xl space-y-4">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-amber-400 font-black">🧠</span>
                                                    <h4 className="font-bold text-sm text-amber-400">إضافة سؤال الاختبار التفاعلي للحصة (Quiz):</h4>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1">نص السؤال:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="مثال: ما هو الأمر المستخدم لطباعة نص في بايثون؟"
                                                        value={newLesson.quizQuestion}
                                                        onChange={e => setNewLesson({ ...newLesson, quizQuestion: e.target.value })}
                                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                                                    />
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الأول (0):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="print()"
                                                            value={newLesson.quizOpt0}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt0: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الثاني (1):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="echo"
                                                            value={newLesson.quizOpt1}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt1: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الثالث (2):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="input()"
                                                            value={newLesson.quizOpt2}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt2: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                </div>
                                                <div className="w-full sm:w-1/3">
                                                    <label className="block text-[11px] text-emerald-400 mb-1 font-bold">الإجابة الصحيحة:</label>
                                                    <select
                                                        value={newLesson.correctOpt}
                                                        onChange={e => setNewLesson({ ...newLesson, correctOpt: Number(e.target.value) })}
                                                        className="w-full bg-slate-900 border border-emerald-500/50 text-emerald-300 font-bold rounded-xl px-3 py-2 text-xs"
                                                    >
                                                        <option value={0}>الخيار الأول هو الصحيح</option>
                                                        <option value={1}>الخيار الثاني هو الصحيح</option>
                                                        <option value={2}>الخيار الثالث هو الصحيح</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-2xl text-base shadow-xl shadow-cyan-500/20 transition flex items-center justify-center gap-2"
                                            >
                                                <span>🚀</span><span>نشر الحصة الجديدة وحفظها سحابياً لجميع الطلاب</span>
                                            </button>
                                        </form>
                                    )}

                                    {/* 2. توليد الأكواد */}
                                    {adminTab === "codes" && (
                                        <div className="space-y-6">
                                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">توليد أكواد لـ (كورس كامل أو حصة منفردة):</label>
                                                    <select
                                                        value={genTargetId}
                                                        onChange={e => setGenTargetId(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    >
                                                        <option value="ALL">🌟 كود شامل VIP يفتح كل المنصة</option>
                                                        <optgroup label="الكورسات الكاملة:">
                                                            {courses.map(c => <option key={c.id} value={c.id}>كورس: {c.title}</option>)}
                                                        </optgroup>
                                                        <optgroup label="الحصص المنفردة:">
                                                            {courses.flatMap(c => c.lessons.map(l => (
                                                                <option key={l.id} value={l.id}>حصة: {l.title} ({c.stage})</option>
                                                            )))}
                                                        </optgroup>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">عدد الأكواد:</label>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        max="100"
                                                        value={genCount}
                                                        onChange={e => setGenCount(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <button
                                                    onClick={handleGenerateCodes}
                                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black py-2.5 px-4 rounded-xl text-sm transition"
                                                >
                                                    ⚡ توليد وحفظ سحابياً فوراً
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto border border-slate-800 rounded-2xl max-h-96">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-900 text-slate-400 sticky top-0 border-b border-slate-800">
                                                        <tr>
                                                            <th className="p-3.5">الكود</th>
                                                            <th className="p-3.5">المخصص له</th>
                                                            <th className="p-3.5">الحالة السحابية</th>
                                                            <th className="p-3.5">نسخ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-800/60">
                                                        {activationCodes.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-800/30">
                                                                <td className="p-3.5 font-mono font-bold text-cyan-400 text-base">{item.code}</td>
                                                                <td className="p-3.5 text-slate-300">
                                                                    {item.targetId === "ALL" ? "جميع الكورسات (VIP)" : item.targetId}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    {item.used ? (
                                                                        <span className="bg-rose-500/20 text-rose-300 text-xs px-2.5 py-1 rounded-full font-bold">مُستخدم (مقفل 🔒)</span>
                                                                    ) : (
                                                                        <span className="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-bold">متاح للإرسال ✅</span>
                                                                    )}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    <button
                                                                        onClick={() => { navigator.clipboard.writeText(item.code); alert(`تم نسخ الكود: ${item.code}`); }}
                                                                        className="bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition"
                                                                    >
                                                                        نسخ 📋
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {/* 3. إدارة الكورسات وحصصها */}
                                    {adminTab === "courses" && (
                                        <div className="space-y-6">
                                            {courses.map(course => (
                                                <div key={course.id} className="bg-slate-900/90 border border-slate-800 p-5 rounded-2xl space-y-4">
                                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-3">
                                                        <div className="flex items-center gap-3">
                                                            <img src={course.thumbnail} alt="" className="w-16 h-12 object-cover rounded-xl border border-slate-700" />
                                                            <div>
                                                                <h4 className="font-black text-white text-base">{course.title}</h4>
                                                                <p className="text-xs text-slate-400">{course.stage} • السعر: <span className="text-cyan-400 font-bold">{course.price} ج.م</span></p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button
                                                                onClick={() => {
                                                                    const p = prompt("أدخل السعر الجديد للكورس بالجنيه:", course.price);
                                                                    if (p !== null) {
                                                                        const updated = courses.map(c => c.id === course.id ? { ...c, price: Number(p) } : c);
                                                                        setCourses(updated);
                                                                        if (window.firebaseModules) {
                                                                            const { getFirestore, doc, updateDoc, initializeApp } = window.firebaseModules;
                                                                            const db = getFirestore(initializeApp(firebaseConfig));
                                                                            updateDoc(doc(db, "courses", course.id), { price: Number(p) });
                                                                        }
                                                                    }
                                                                }}
                                                                className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-white font-bold"
                                                            >
                                                                تعديل السعر 💰
                                                            </button>
                                                            <button
                                                                onClick={() => {
                                                                    const t = prompt("أدخل رابط صورة الثامنيل الجديدة للكورس:", course.thumbnail);
                                                                    if (t && t.trim()) {
                                                                        const updated = courses.map(c => c.id === course.id ? { ...c, thumbnail: t.trim() } : c);
                                                                        setCourses(updated);
                                                                        if (window.firebaseModules) {
                                                                            const { getFirestore, doc, updateDoc, initializeApp } = window.firebaseModules;
                                                                            const db = getFirestore(initializeApp(firebaseConfig));
                                                                            updateDoc(doc(db, "courses", course.id), { thumbnail: t.trim() });
                                                                        }
                                                                    }
                                                                }}
                                                                className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-white font-bold"
                                                            >
                                                                تغيير الثامنيل 🖼️
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* قائمة الحصص بداخل الكورس مع إمكانية حذف أي حصة */}
                                                    <div className="space-y-2">
                                                        <p className="text-xs text-slate-400 font-bold">الحصص المرفوعة داخل الكورس:</p>
                                                        {course.lessons.map((lesson, lIdx) => (
                                                            <div key={lesson.id} className="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 text-xs">
                                                                <div className="flex items-center gap-3">
                                                                    <img src={lesson.thumbnail || course.thumbnail} alt="" className="w-12 h-9 object-cover rounded-lg border border-slate-700" />
                                                                    <div>
                                                                        <p className="font-bold text-white">{lIdx + 1}. {lesson.title}</p>
                                                                        <span className="text-[11px] text-slate-400">⏱️ {lesson.duration} • 💰 منفردة: {lesson.price} ج.م {lesson.isFree && "• (مجانية)"}</span>
                                                                    </div>
                                                                </div>
                                                                <button
                                                                    onClick={() => handleDeleteLesson(course.id, lesson.id)}

                                    <button

                                        disabled={isFirebaseSyncing}
                                        className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition flex items-center justify-center gap-2"
                                    >
                                        {isFirebaseSyncing ? "جاري التحقق من السحابة..." : "🚀 تفعيل المحتوى الآن"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                            <p>© 2026 جميع الحقوق محفوظة — منصة <strong>{SITE_CONFIG.platformName}</strong></p>
                            <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-2">
                                <a href={SITE_CONFIG.youtubeChannelUrl} target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition inline-flex items-center gap-1.5">
                                    <span>قناة يوتيوب</span><window.AMC_UI.BrandIcon name="youtube" className="w-4 h-4 shrink-0" />
                                </a>
                                <span>•</span>
                                <a href="https://t.me/+I1sd1fofszgzNTE8" target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition inline-flex items-center gap-1.5"><span>تيليجرام</span><window.AMC_UI.BrandIcon name="telegram" className="w-4 h-4 shrink-0" /></a>
                                <span>•</span>
                                <a href="https://www.tiktok.com/@eng_mansour_ragab" target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition inline-flex items-center gap-1.5"><span>تيك توك</span><window.AMC_UI.BrandIcon name="tiktok" className="w-4 h-4 shrink-0" /></a>

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

(function () {

  /* ---------- Three.js hero (نسخة أخف على الموبايل، ويتوقف خارج الشاشة) ---------- */

    var n = mobile ? 160 : 520, pos = new Float32Array(n * 3);
