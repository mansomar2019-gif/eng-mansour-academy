        function extractYouTubeId(input) {
            if (!input) return "";
            const trimmed = input.trim();
            if (trimmed.length === 11 && !trimmed.includes("/") && !trimmed.includes(".")) {
                return trimmed;
            }
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = trimmed.match(regExp);
            return (match && match[2].length === 11) ? match[2] : trimmed;
        }

                                    target="_blank"
                                    rel="noreferrer"
                                    className="hidden sm:flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-2.5 rounded-xl text-sm font-bold transition"
                                >
                                    <span>💬</span>
                                    <span>تواصل واتساب</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* ================= MAIN CONTENT ================= */}
                    <main className="flex-grow">
                        {isAdminAuthenticated ? (
                            /* ================= 🔒 لوحة تحكم المهندس منصور (الأدمن فقط) ================= */
                            <div className="max-w-6xl mx-auto px-4 py-10">
                                <div className="bg-cardBg border border-purple-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl">
                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-6">
                                        <div>
                                            <span className="text-xs font-bold uppercase tracking-wider bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full">لوحة الإدارة السرية</span>
                                            <h2 className="text-2xl font-black text-white mt-2">مرحباً بك يا {SITE_CONFIG.instructorTitle} 👋</h2>
                                            <p className="text-slate-400 text-sm">من هنا يمكنك توليد أكواد التفعيل وإضافة الحصص والكورسات وتعديل الأسعار.</p>
                                        </div>
                                        <button
                                            onClick={() => setIsAdminAuthenticated(false)}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-bold transition"
                                        >
                                            العودة لواجهة الطلاب ⬅️
                                        </button>
                                    </div>

                                    {/* تبويبات الأدمن */}
                                    <div className="flex flex-wrap gap-2 mb-8">
                                        <button
                                            onClick={() => setAdminTab("codes")}
                                            className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "codes" ? "bg-cyan-500 text-slate-950" : "bg-slate-800/80 text-slate-300 hover:bg-slate-700"}`}
                                        >
                                            🔑 توليد وإدارة الأكواد ({activationCodes.length})
                                        </button>
                                        <button
                                            onClick={() => setAdminTab("lessons")}
                                            className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "lessons" ? "bg-cyan-500 text-slate-950" : "bg-slate-800/80 text-slate-300 hover:bg-slate-700"}`}
                                        >
                                            🎬 إضافة حصة يوتيوب (غير مدرج)
                                        </button>
                                        <button
                                            onClick={() => setAdminTab("courses")}
                                            className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "courses" ? "bg-cyan-500 text-slate-950" : "bg-slate-800/80 text-slate-300 hover:bg-slate-700"}`}
                                        >
                                            📚 إضافة كورس جديد / تعديل سعر
                                        </button>
                                        <button
                                            onClick={() => setAdminTab("export")}
                                            className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "export" ? "bg-amber-500 text-slate-950" : "bg-slate-800/80 text-amber-300 hover:bg-slate-700"}`}
                                        >
                                            💾 نسخ الكود لحفظه نهائياً للطلاب
                                        </button>
                                    </div>

                                    {/* 1. قسم توليد الأكواد */}
                                    {adminTab === "codes" && (
                                        <div className="space-y-6">
                                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">اختر الكورس المراد توليد أكواد له:</label>
                                                    <select
                                                        value={genCourseId}
                                                        onChange={(e) => setGenCourseId(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    >
                                                        <option value="ALL">🌟 كود شامل يفتح كل الكورسات (VIP)</option>
                                                        {courses.map(c => (
                                                            <option key={c.id} value={c.id}>{c.title}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">عدد الأكواد المطلوبة:</label>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        max="100"
                                                        value={genCount}
                                                        onChange={(e) => setGenCount(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <button
                                                    onClick={handleGenerateCodes}
                                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-2.5 px-4 rounded-xl text-sm transition"
                                                >
                                                    ⚡ توليد الأكواد الآن
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto border border-slate-800 rounded-2xl">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-900 text-slate-400 border-b border-slate-800">
                                                        <tr>
                                                            <th className="p-3.5">كود التفعيل</th>
                                                            <th className="p-3.5">الكورس المخصص</th>
                                                            <th className="p-3.5">الحالة</th>
                                                            <th className="p-3.5">نسخ الكود</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-800/60">
                                                        {activationCodes.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-800/30">
                                                                <td className="p-3.5 font-mono font-bold text-cyan-400 text-base">{item.code}</td>
                                                                <td className="p-3.5 text-slate-300">
                                                                    {item.courseId === "ALL" ? "جميع الكورسات (VIP)" : (courses.find(c => c.id === item.courseId)?.title || item.courseId)}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    {item.used ? (
                                                                        <span className="bg-rose-500/20 text-rose-300 text-xs px-2.5 py-1 rounded-full">مُستخدم</span>
                                                                    ) : (
                                                                        <span className="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full">متاح للإرسال</span>
                                                                    )}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    <button
                                                                        onClick={() => {
                                                                            navigator.clipboard.writeText(item.code);
                                                                            alert(`تم نسخ الكود: ${item.code}`);
                                                                        }}
                                                                        className="bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition"
                                                                    >
                                                                        نسخ 📋
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {/* 2. قسم إضافة حصة يوتيوب */}
                                    {adminTab === "lessons" && (
                                        <form onSubmit={handleAddLesson} className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-cyan-400">إضافة حصة جديدة من يوتيوب (Unlisted)</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">اختر الكورس:</label>
                                                    <select
                                                        value={newLesson.courseId}
                                                        onChange={(e) => setNewLesson({ ...newLesson, courseId: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    >
                                                        {courses.map(c => (
                                                            <option key={c.id} value={c.id}>{c.title}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">عنوان الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="مثال: الحصة 4: الحلقات التكرارية Loops"
                                                        value={newLesson.title}
                                                        onChange={(e) => setNewLesson({ ...newLesson, title: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">رابط فيديو يوتيوب (أو الـ Video ID):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://www.youtube.com/watch?v=xxxxxxxxxxx"
                                                        value={newLesson.videoUrl}
                                                        onChange={(e) => setNewLesson({ ...newLesson, videoUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                    <p className="text-[11px] text-slate-400 mt-1">💡 الصق رابط اليوتيوب كامل والمنصة ستستخرج الـ ID تلقائياً.</p>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">رابط ملزمة الـ PDF (من Google Drive):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://drive.google.com/file/d/..."
                                                        value={newLesson.pdfUrl}
                                                        onChange={(e) => setNewLesson({ ...newLesson, pdfUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">مدة الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="50 دقيقة"
                                                        value={newLesson.duration}
                                                        onChange={(e) => setNewLesson({ ...newLesson, duration: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <div className="flex items-center gap-3 pt-6">
                                                    <input
                                                        type="checkbox"
                                                        id="freeCheck"
                                                        checked={newLesson.isFree}
                                                        onChange={(e) => setNewLesson({ ...newLesson, isFree: e.target.checked })}
                                                        className="w-5 h-5 accent-cyan-500"
                                                    />
                                                    <label htmlFor="freeCheck" className="text-sm font-bold text-slate-200 cursor-pointer">
                                                        جعل هذه الحصة مجانية مفتوحة للجميع (كتجربة)
                                                    </label>
                                                </div>
                                            </div>
                                            <button
                                                type="submit"
                                                className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-6 py-3 rounded-xl text-sm transition"
                                            >
                                                ➕ حفظ وإضافة الحصة للكورس
                                            </button>
                                        </form>
                                    )}

                                    {/* 3. قسم إضافة كورس جديد وتعديل الأسعار */}
                                    {adminTab === "courses" && (
                                        <div className="space-y-8">
                                            <form onSubmit={handleAddCourse} className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 space-y-4">
                                                <h3 className="text-lg font-bold text-cyan-400">إنشاء كورس جديد بالثامنيل والسعر الخاص بك</h3>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs text-slate-400 mb-1.5 font-bold">اسم الكورس:</label>
                                                        <input
                                                            type="text"
                                                            placeholder="مثال: المراجعة النهائية - أولى ثانوي"
                                                            value={newCourse.title}
                                                            onChange={(e) => setNewCourse({ ...newCourse, title: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-slate-400 mb-1.5 font-bold">المرحلة الدراسية:</label>
                                                        <select
                                                            value={newCourse.stage}
                                                            onChange={(e) => setNewCourse({ ...newCourse, stage: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                        >
                                                            <option value="الصف الأول الثانوي">الصف الأول الثانوي</option>
                                                            <option value="الصف الثاني الثانوي - بكالوريا">الصف الثاني الثانوي - بكالوريا</option>
                                                            <option value="تأسيس البرمجة">تأسيس البرمجة</option>
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-slate-400 mb-1.5 font-bold">السعر بالجنيه المصري:</label>
                                                        <input
                                                            type="number"
                                                            value={newCourse.price}
                                                            onChange={(e) => setNewCourse({ ...newCourse, price: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs text-slate-400 mb-1.5 font-bold">رابط صورة الثامنيل (Thumbnail URL):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg"
                                                            value={newCourse.thumbnail}
                                                            onChange={(e) => setNewCourse({ ...newCourse, thumbnail: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                        />
                                                    </div>
                                                    <div className="sm:col-span-2">
                                                        <label className="block text-xs text-slate-400 mb-1.5 font-bold">وصف الكورس:</label>
                                                        <textarea
                                                            rows="2"
                                                            placeholder="اكتب نبذة سريعة تشجع الطالب على الاشتراك..."
                                                            value={newCourse.description}
                                                            onChange={(e) => setNewCourse({ ...newCourse, description: e.target.value })}
                                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                        ></textarea>
                                                    </div>
                                                </div>
                                                <button
                                                    type="submit"
                                                    className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-6 py-3 rounded-xl text-sm transition"
                                                >
                                                    🚀 نشر الكورس الجديد
                                                </button>
                                            </form>

                                            {/* تعديل سريع لأسعار الكورسات الحالية */}
                                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6">
                                                <h4 className="font-bold text-white mb-4">تعديل سريع لأسعار وثامنيل الكورسات الحالية:</h4>
                                                <div className="space-y-4">
                                                    {courses.map(course => (
                                                        <div key={course.id} className="flex flex-wrap items-center justify-between gap-4 bg-slate-800/50 p-4 rounded-xl border border-slate-700/60">
                                                            <div className="flex items-center gap-3">
                                                                <img src={course.thumbnail} alt="" className="w-16 h-12 object-cover rounded-lg" />
                                                                <div>
                                                                    <p className="font-bold text-sm text-white">{course.title}</p>
                                                                    <p className="text-xs text-slate-400">{course.lessons.length} حصص مضافة</p>
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <label className="text-xs text-slate-400">السعر (ج.م):</label>
                                                                <input
                                                                    type="number"
                                                                    value={course.price}
                                                                    onChange={(e) => {
                                                                        const val = Number(e.target.value);
                                                                        setCourses(courses.map(c => c.id === course.id ? { ...c, price: val } : c));
                                                                    }}
                                                                    className="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-sm font-bold text-cyan-400"
                                                                />
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* 4. قسم تصدير البيانات لتثبيتها في ملف الموقع */}
                                    {adminTab === "export" && (
                                        <div className="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-amber-400">كيف تحفظ تعديلاتك لتظهر عند كل الطلاب على الموبايلات؟</h3>
                                            <p className="text-sm text-slate-300 leading-relaxed">
                                                بعد أن تضيف حصصك وتولد الأكواد هنا، اضغط الزر بالأسفل لنسخ بيانات الكورسات والأكواد الجاهزة، واستبدل بها جزئية <code className="text-cyan-400">INITIAL_COURSES</code> و <code className="text-cyan-400">INITIAL_CODES</code> داخل ملف <code className="text-cyan-400">index.html</code> قبل رفعه على Netlify، أو اربطها بـ Firebase مجاناً.
                                            </p>
                                            <div className="flex flex-wrap gap-3">
                                                <button
                                                    onClick={() => {
                                                        const exportStr = `const INITIAL_COURSES = ${JSON.stringify(courses, null, 4)};

const INITIAL_CODES = ${JSON.stringify(activationCodes, null, 4)};`;
                                                        navigator.clipboard.writeText(exportStr);
                                                        alert("تم نسخ كود البيانات بالكامل! يمكنك لصقه في ملف index.html");
                                                    }}
                                                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-sm transition"
                                                >
                                                    📋 نسخ كود الكورسات والأكواد المحدثة
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : activeCourse ? (
                            /* ================= 🎥 مشغل الكورسات والحصص للطالب ================= */
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                <button
                                    onClick={() => { setActiveCourse(null); setActiveLesson(null); }}
                                    className="mb-6 inline-flex items-center gap-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition"
                                >
                                    <span>➡️</span>
                                    <span>العودة لجميع الكورسات</span>
                                </button>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* عمود مشغل الفيديو والملزمة والاختبار */}
                                    <div className="lg:col-span-2 space-y-6">
                                        {activeLesson && (activeLesson.isFree || isCourseUnlocked(activeCourse.id)) ? (
                                            <div className="bg-cardBg border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl space-y-5">
                                                <div className="video-wrapper shadow-2xl border border-slate-800">
                                                    <iframe
                                                        src={`https://www.youtube-nocookie.com/embed/${activeLesson.videoId}?rel=0&modestbranding=1`}
                                                        title={activeLesson.title}
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                                        allowFullScreen
                                                    ></iframe>
                                                </div>

                                                <div className="flex flex-wrap items-center justify-between gap-4 pt-2 border-b border-slate-800 pb-4">
                                                    <div>
                                                        <span className="text-xs text-cyan-400 font-bold">{activeCourse.title}</span>
                                                        <h2 className="text-xl font-black text-white mt-1">{activeLesson.title}</h2>
                                                    </div>
                                                    <a
                                                        href={activeLesson.pdfUrl}
                                                        target="_blank"
                                                        rel="noreferrer"
                                                        className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-purple-600/25"
                                                    >
                                                        <span>📄</span>
                                                        <span>تحميل ملزمة الحصة PDF</span>
                                                    </a>
                                                </div>

                                                {/* سؤال تفاعلي سريع للطالب */}
                                                {activeLesson.quizQuestion && (
                                                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-3">
                                                        <h4 className="font-bold text-amber-400 text-sm flex items-center gap-2">
                                                            <span>🧠</span>
                                                            <span>سؤال سريع للتأكد من فهم الحصة:</span>
                                                        </h4>
                                                        <p className="text-white font-semibold text-sm">{activeLesson.quizQuestion}</p>
                                                        <div className="space-y-2 pt-1">
                                                            {activeLesson.quizOptions.map((opt, i) => (
                                                                <button
                                                                    key={i}
                                                                    onClick={() => setQuizSelected(i)}
                                                                    className={`w-full text-right p-3 rounded-xl text-sm font-medium border transition flex items-center justify-between ${
                                                                        quizSelected === i
                                                                            ? i === activeLesson.correctOption
                                                                                ? "bg-emerald-500/20 border-emerald-500 text-emerald-300"
                                                                                : "bg-rose-500/20 border-rose-500 text-rose-300"
                                                                            : "bg-slate-800/70 border-slate-700/70 text-slate-300 hover:bg-slate-800"
                                                                    }`}
                                                                >
                                                                    <span>{opt}</span>
                                                                    {quizSelected === i && (
                                                                        <span>{i === activeLesson.correctOption ? "✅ إجابة صحيحة!" : "❌ حاول مرة أخرى"}</span>
                                                                    )}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            /* شاشة القفل إذا كانت الحصة مدفوعة والكورس غير مفعل */
                                            <div className="bg-cardBg border border-slate-800 rounded-3xl p-8 sm:p-12 text-center space-y-5 shadow-2xl">
                                                <div className="w-20 h-20 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-4xl mx-auto">
                                                    🔒
                                                </div>
                                                <h3 className="text-2xl font-black text-white">هذه الحصة للمشتركين في الكورس</h3>
                                                <p className="text-slate-400 max-w-md mx-auto text-sm leading-relaxed">
                                                    اشترك الآن في <strong>{activeCourse.title}</strong> بسعر <strong>{activeCourse.price} ج.م</strong> فقط واحصل على كود التفعيل الفوري لفتح جميع الحصص والملازم والاختبارات.
                                                </p>
                                                <button
                                                    onClick={() => {
                                                        setTargetCourseForCode(activeCourse);
                                                        setShowPaymentModal(true);
                                                    }}
                                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black px-8 py-3.5 rounded-2xl text-sm shadow-xl shadow-cyan-500/20 transition"
                                                >
                                                    🔑 تفعيل الكورس بالكود / طرق الدفع
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    {/* عمود قائمة حصص الكورس */}
                                    <div className="bg-cardBg border border-slate-800 rounded-3xl p-5 h-fit space-y-4">
                                        <div className="border-b border-slate-800 pb-4 flex items-center justify-between">
                                            <div>
                                                <h3 className="font-black text-lg text-white">محتوى الكورس</h3>
                                                <p className="text-xs text-slate-400">{activeCourse.lessons.length} حصص مسجلة بجودة عالية</p>
                                            </div>
                                            {isCourseUnlocked(activeCourse.id) ? (
                                                <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full">مُفعّل ✅</span>
                                            ) : (
                                                <button
                                                    onClick={() => {
                                                        setTargetCourseForCode(activeCourse);
                                                        setShowPaymentModal(true);
                                                    }}
                                                    className="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 text-xs font-bold px-3 py-1.5 rounded-xl hover:bg-cyan-500 hover:text-slate-950 transition"
                                                >
                                                    فتح الكورس 🔓
                                                </button>
                                            )}
                                        </div>

                                        <div className="space-y-2.5">
                                            {activeCourse.lessons.map((lesson, index) => {
                                                const unlocked = lesson.isFree || isCourseUnlocked(activeCourse.id);
                                                const isCurrent = activeLesson && activeLesson.id === lesson.id;
                                                return (
                                                    <div
                                                        key={lesson.id}
                                                        onClick={() => {
                                                            setActiveLesson(lesson);
                                                            setQuizSelected(null);
                                                        }}
                                                        className={`p-3.5 rounded-2xl border cursor-pointer transition flex items-center justify-between gap-3 ${
                                                            isCurrent
                                                                ? "bg-cyan-500/15 border-cyan-500 text-white"
                                                                : "bg-slate-900/70 border-slate-800/80 text-slate-300 hover:bg-slate-800/60"
                                                        }`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black ${
                                                                unlocked ? "bg-cyan-500/20 text-cyan-300" : "bg-slate-800 text-slate-500"
                                                            }`}>
                                                                {index + 1}
                                                            </div>
                                                            <div>
                                                                <p className="text-sm font-bold leading-snug">{lesson.title}</p>
                                                                <span className="text-[11px] text-slate-400">⏱️ {lesson.duration}</span>
                                                            </div>
                                                        </div>
                                                        <div>
                                                            {lesson.isFree ? (
                                                                <span className="text-[11px] bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full font-bold">مجانية</span>
                                                            ) : unlocked ? (
                                                                <span className="text-cyan-400 text-sm">▶️</span>
                                                            ) : (
                                                                <span className="text-slate-500 text-sm">🔒</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* ================= 🏠 الصفحة الرئيسية وواجهة الطلاب ================= */
                            <div>
                                {/* HERO SECTION */}
                                <section className="relative overflow-hidden py-14 sm:py-20 border-b border-slate-800/80">
                                    <div className="absolute -top-32 -left-32 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                                    <div className="absolute top-20 -right-32 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

                                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-6 relative z-10">
                                        <div className="inline-flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 px-4 py-1.5 rounded-full text-xs sm:text-sm text-cyan-300 font-bold">
                                            <span>🚀</span>
                                            <span>منصة {SITE_CONFIG.instructorTitle} لتدريس البرمجة والذكاء الاصطناعي</span>
                                        </div>

                                        <h2 className="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-tight max-w-4xl mx-auto">
                                            افهم البرمجة والذكاء الاصطناعي صح.. وكون <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">مبرمج المستقبل</span>
                                        </h2>

                                        <p className="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed">
                                            حصص مسجلة بأعلى جودة لطلاب الصف الأول الثانوي، والصف الثاني الثانوي (نظام البكالوريا الجديد)، وكورسات تأسيس البرمجة من الصفر مع ملازم PDF واختبارات دورية.
                                        </p>

                                        <div className="flex flex-wrap items-center justify-center gap-4 pt-2">
                                            <a
                                                href="#courses-section"
                                                className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black px-7 py-3.5 rounded-2xl text-sm sm:text-base shadow-xl shadow-cyan-500/20 transition"
                                            >
                                                📚 تصفح الكورسات والحصص المجانية
                                            </a>
                                            <button
                                                onClick={() => {
                                                    setTargetCourseForCode(null);
                                                    setShowPaymentModal(true);
                                                }}
                                                className="bg-slate-800/90 hover:bg-slate-700 text-white border border-slate-700 font-bold px-6 py-3.5 rounded-2xl text-sm sm:text-base transition"
                                            >
                                                🔑 تفعيل كود الكورس
                                            </button>
                                        </div>
                                    </div>
                                </section>

                                {/* فلترة المراحل الدراسية والكورسات */}
                                <section id="courses-section" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 space-y-8">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div>
                                            <h3 className="text-2xl font-black text-white">الكورسات المتاحة بالمنصة</h3>
                                            <p className="text-sm text-slate-400">يمكنك مشاهدة الحصة الأولى من أي كورس مجاناً قبل الاشتراك</p>
                                        </div>

                                        <div className="flex flex-wrap gap-2">
                                            {["الكل", "الصف الأول الثانوي", "الصف الثاني الثانوي - بكالوريا", "تأسيس البرمجة"].map(stage => (
                                                <button
                                                    key={stage}
                                                    onClick={() => setSelectedStage(stage)}
                                                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                                                        selectedStage === stage
                                                            ? "bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/20"
                                                            : "bg-cardBg text-slate-300 border border-slate-800 hover:border-slate-700"
                                                    }`}
                                                >
                                                    {stage}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* شبكة الكورسات */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
                                        {filteredCourses.map(course => {
                                            const unlocked = isCourseUnlocked(course.id);
                                            return (
                                                <div
                                                    key={course.id}
                                                    className="bg-cardBg border border-slate-800/90 hover:border-cyan-500/50 rounded-3xl overflow-hidden flex flex-col justify-between transition duration-300 shadow-xl group"
                                                >
                                                    <div>
                                                        <div className="relative h-52 overflow-hidden bg-slate-900">
                                                            <img
                                                                src={course.thumbnail}
                                                                alt={course.title}
                                                                className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                                            />
                                                            <div className="absolute top-3 right-3 bg-slate-950/85 backdrop-blur-md text-cyan-300 border border-cyan-500/30 text-xs font-bold px-3 py-1 rounded-full">
                                                                {course.badge}
                                                            </div>
                                                            <div className="absolute bottom-3 left-3 bg-slate-950/90 text-white text-xs font-black px-3 py-1.5 rounded-xl border border-slate-700">
                                                                {course.price} ج.م
                                                            </div>
                                                        </div>

                                                        <div className="p-6 space-y-3">
                                                            <span className="text-xs font-bold text-purple-400">{course.stage}</span>
                                                            <h4 className="text-lg font-black text-white leading-snug">{course.title}</h4>
                                                            <p className="text-xs text-slate-400 leading-relaxed">{course.description}</p>
                                                        </div>
                                                    </div>

                                                    <div className="px-6 pb-6 pt-2 space-y-3">
                                                        <div className="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-3">
                                                            <span>🎬 {course.lessons.length} حصص</span>
                                                            <span>📄 شاملة الملازم والـ PDF</span>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-2.5">
                                                            <button
                                                                onClick={() => {
                                                                    setActiveCourse(course);
                                                                    setActiveLesson(course.lessons[0] || null);
                                                                }}
                                                                className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs sm:text-sm transition"
                                                            >
                                                                ▶️ {unlocked ? "دخول الكورس" : "شاهد الحصة 1 مجاناً"}
                                                            </button>

                                                            {unlocked ? (
                                                                <div className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 font-bold py-2.5 px-3 rounded-xl text-xs sm:text-sm flex items-center justify-center">
                                                                    مُفعّل لديك ✅
                                                                </div>
                                                            ) : (
                                                                <button
                                                                    onClick={() => {
                                                                        setTargetCourseForCode(course);
                                                                        setShowPaymentModal(true);
                                                                    }}
                                                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-2.5 px-3 rounded-xl text-xs sm:text-sm transition"
                                                                >
                                                                    🔑 اشترك / فعّل الكود
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {/* ================= 💳 نافذة الدفع وتفعيل الكود للطالب ================= */}
                    {showPaymentModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-cardBg border border-slate-700 rounded-3xl max-w-md w-full p-6 sm:p-7 space-y-5 shadow-2xl relative">
                                <button
                                    onClick={() => {
                                        setShowPaymentModal(false);
                                        setCodeMessage({ type: "", text: "" });
                                    }}
                                    className="absolute top-5 left-5 text-slate-400 hover:text-white text-xl"
                                >
                                    ✕
                                </button>

                                <div>
                                    <span className="text-xs bg-cyan-500/20 text-cyan-300 px-3 py-1 rounded-full font-bold">تفعيل فوري</span>
                                    <h3 className="text-xl font-black text-white mt-2">
                                        {targetCourseForCode ? `تفعيل: ${targetCourseForCode.title}` : "تفعيل كود الاشتراك"}
                                    </h3>
                                </div>

                                {/* خطوات الدفع عبر فودافون كاش أو انستا باي */}
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-2.5 text-xs sm:text-sm">
                                    <p className="font-bold text-amber-400">📲 ازاي تجيب كود التفعيل؟</p>
                                    <ol className="list-decimal list-inside space-y-1.5 text-slate-300">
                                        <li>
                                            حول قيمة الكورس {targetCourseForCode ? `(${targetCourseForCode.price} ج.م)` : ""} فودافون كاش أو انستا باي على رقم:{" "}
                                            <span className="font-mono font-bold text-cyan-400 select-all">{SITE_CONFIG.vodafoneCashNumber}</span>
                                        </li>
                                        <li>أرسل صورة التحويل على واتساب لاستلام كود التفعيل الخاص بك فوراً.</li>
                                    </ol>
                                    <a
                                        href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${encodeURIComponent(`السلام عليكم يا بشمهندس منصور، حولت اشتراك (${targetCourseForCode ? targetCourseForCode.title : "الكورس"}) وعايز أستلم كود التفعيل.`)}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="mt-2 w-full bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 font-bold py-2 rounded-xl flex items-center justify-center gap-2 transition"
                                    >
                                        <span>💬</span>
                                        <span>إرسال إيصال التحويل على واتساب</span>
                                    </a>
                                </div>

                                {/* نموذج إدخال الكود */}
                                <form onSubmit={handleActivateCode} className="space-y-3 pt-1">
                                    <label className="block text-xs font-bold text-slate-300">أدخل كود التفعيل هنا:</label>
                                    <input
                                        type="text"
                                        placeholder="مثال: MNS-2026"
                                        value={codeInput}
                                        onChange={(e) => setCodeInput(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-3 text-center font-mono text-base font-bold text-white uppercase tracking-widest focus:outline-none"
                                    />

                                    {codeMessage.text && (
                                        <p className={`text-xs font-bold p-3 rounded-xl text-center ${
                                            codeMessage.type === "success" ? "bg-emerald-500/20 text-emerald-300" : "bg-rose-500/20 text-rose-300"
                                        }`}>
                                            {codeMessage.text}
                                        </p>
                                    )}

                                    <button
                                        type="submit"
                                        className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition"
                                    >
                                        🚀 تفعيل الكورس الآن
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ================= 🔒 نافذة تسجيل دخول الأدمن السرية ================= */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-cardBg border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                                <button
                                    onClick={() => { setShowAdminLogin(false); setPinInput(""); }}
                                    className="absolute top-4 left-4 text-slate-400 hover:text-white"
                                >
                                    ✕
                                </button>
                                <h3 className="text-lg font-black text-white">🔒 دخول إدارة المنصة</h3>
                                <p className="text-xs text-slate-400">هذه اللوحة خاصة بالمهندس منصور فقط لإدارة الأكواد والحصص.</p>
                                <input
                                    type="password"
                                    placeholder="أدخل كلمة المرور السرية"
                                    value={pinInput}
                                    onChange={(e) => setPinInput(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                                />
                                <button
                                    onClick={() => {
                                        if (pinInput === adminPin) {
                                            setIsAdminAuthenticated(true);
                                            setShowAdminLogin(false);
                                            setPinInput("");
                                        } else {
                                            alert("كلمة المرور غير صحيحة!");
                                        }
                                    }}
                                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-sm transition"
                                >
                                    دخول لوحة التحكم
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ================= FOOTER ================= */}
                    <footer className="border-t border-slate-800/80 bg-[#080B12] py-8 mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                            <p>© 2026 جميع الحقوق محفوظة — منصة <strong>{SITE_CONFIG.platformName}</strong></p>
                            <div className="flex items-center gap-4">
                                <a href={SITE_CONFIG.youtubeChannelUrl} target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition">
                                    قناة يوتيوب
                                </a>
                                <span>•</span>
                                {/* الزر السري لدخول المهندس منصور للوحة التحكم */}
                                <button
                                    onClick={() => setShowAdminLogin(true)}
                                    className="text-slate-600 hover:text-slate-400 transition"
                                >
                                    دخول الإدارة 🔒
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
