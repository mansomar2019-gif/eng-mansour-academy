        function extractYouTubeId(input) {
            if (!input) return "";
            const trimmed = input.trim();
            if (trimmed.length === 11 && !trimmed.includes("/") && !trimmed.includes(".")) return trimmed;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = trimmed.match(regExp);
            return (match && match[2].length === 11) ? match[2] : trimmed;
        }

                }

                try {
                    const { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup } = window.firebaseModules;

            const handleActivateCode = async (e) => {
                e.preventDefault();
                const cleaned = codeInput.trim().toUpperCase();
                if (!cleaned) {
                    setCodeMessage({ type: "error", text: "يرجى كتابة كود التفعيل" });
                    return;
                }

                setIsFirebaseSyncing(true);
                try {
                    const { initializeApp, getFirestore, doc, updateDoc, collection, getDocs } = window.firebaseModules || {};
                    let currentCodes = activationCodes;

                    if (window.firebaseModules) {
                        const db = getFirestore(initializeApp(firebaseConfig));
                        const freshSnap = await getDocs(collection(db, "codes"));
                        if (!freshSnap.empty) {
                            currentCodes = [];
                            freshSnap.forEach(d => currentCodes.push(d.data()));
                            setActivationCodes(currentCodes);
                        }
                    }

                    const foundCode = currentCodes.find(c => c.code.toUpperCase() === cleaned);
                    if (!foundCode) {
                        setCodeMessage({ type: "error", text: "❌ كود غير صحيح! تأكد من كتابته بشكل سليم أو تواصل مع المهندس منصور." });

                        return;
                    }

                    setCodeMessage({ type: "success", text: "🎉 تم التفعيل بنجاح! تم فتح المحتوى لك على هذا الجهاز." });

                        setCodeMessage({ type: "", text: "" });

                    console.error(err);
                    setCodeMessage({ type: "error", text: "حدث خطأ في الاتصال. يرجى مراجعة اتصال الإنترنت." });
                } finally {
                    setIsFirebaseSyncing(false);
                }
            };

            // توليد الأكواد
            const handleGenerateCodes = async () => {
                const prefix = genTargetId === "ALL" ? "VIP" : genTargetId.substring(0, 4).toUpperCase();
                const newBatch = [];
                const { getFirestore, doc, setDoc, initializeApp } = window.firebaseModules || {};
                const db = window.firebaseModules ? getFirestore(initializeApp(firebaseConfig)) : null;

                for (let i = 0; i < Number(genCount); i++) {
                    const randomNum = Math.floor(10000 + Math.random() * 90000);
                    const codeStr = `${prefix}-${randomNum}`;
                    const codeData = {
                        code: codeStr,
                        targetId: genTargetId,
                        used: false,
                        createdAt: new Date().toISOString()
                    };
                    newBatch.push(codeData);

                    if (db) {
                        try {
                            await setDoc(doc(db, "codes", codeStr), codeData);
                        } catch(e) { console.error(e); }
                    }
                }
                alert(`✅ تم توليد وحفظ ${genCount} أكواد سحابياً بنجاح!`);
            };

            // إضافة الحصة الشاملة الجديدة بالثامنيل والسعر والاختبار والـ PDF
            const handleAddComprehensiveLesson = async (e) => {
                e.preventDefault();
                if (!newLesson.title || !newLesson.videoUrl) {
                    alert("يرجى كتابة عنوان الحصة ورابط فيديو اليوتيوب");

                    correctOption: Number(newLesson.correctOpt) || 0

                        return updated;

                setCourses(updatedCourses);

                    duration: "45 دقيقة",

                        return mod;
                    }
                    return c;
                });
                setCourses(updated);

            const filteredCourses = selectedStage === "الكل" ? courses : courses.filter(c => c.stage === selectedStage);

            return (

                                    >
                                        <svg className="w-4 h-4" viewBox="0 0 24 24">
                                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.32 7.21 24 12 24z"/>
                                            <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.49-.39-2.24s.14-1.52.39-2.24V6.62H1.18C.43 8.12 0 9.8 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.21 0 3.16 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                                        </svg>
                                        <span>دخول بجوجل</span>
                                    </button>
                                )}

                                <button
                                    onClick={() => { setTargetItemForCode(null); setShowPaymentModal(true); }}
                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition flex items-center gap-2"
                                >
                                    <span>🔑</span><span>معاك كود تفعيل؟</span>
                                </button>
                                <a
                                    href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${encodeURIComponent("السلام عليكم يا بشمهندس منصور، كنت عايز أشترك في المنصة وأستلم كود التفعيل")}`}
                                    target="_blank"
                                    rel="noreferrer"
                                    className="hidden sm:flex items-center gap-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-4 py-2.5 rounded-xl text-sm font-bold transition"
                                >
                                    <span>💬</span><span>تواصل واتساب</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {isAdminAuthenticated ? (
                            /* لوحة الأدمن الشاملة */
                            <div className="max-w-6xl mx-auto px-4 py-10">
                                <div className="bg-cardBg border border-purple-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl">
                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-6">
                                        <div>
                                            <span className="text-xs font-bold uppercase tracking-wider bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full">لوحة الإدارة السحابية الشاملة ☁️</span>
                                            <h2 className="text-2xl font-black text-white mt-2">إدارة الحصص والكورسات يا {SITE_CONFIG.instructorTitle} 👋</h2>
                                            <p className="text-slate-400 text-sm">أضف أي حصة جديدة بكل تفاصيلها (الثامنيل، السعر المنفرد، ملزمة الـ PDF، وسؤال الاختبار التفاعلي) ومزامنتها سحابياً فوراً.</p>
                                        </div>
                                        <button onClick={() => setIsAdminAuthenticated(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-bold transition">
                                            العودة لواجهة الطلاب ⬅️
                                        </button>
                                    </div>

                                    {/* تبويبات الإدارة */}
                                    <div className="flex flex-wrap gap-2 mb-8">
                                        <button onClick={() => setAdminTab("lessons")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "lessons" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            🎬 إضافة حصة جديدة (شاملة الثامنيل والسعر والاختبار)
                                        </button>
                                        <button onClick={() => setAdminTab("codes")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "codes" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            🔑 توليد أكواد الكورسات والحصص ({activationCodes.length})
                                        </button>
                                        <button onClick={() => setAdminTab("courses")} className={`px-4 py-2.5 rounded-xl font-bold text-sm transition ${adminTab === "courses" ? "bg-cyan-500 text-slate-950" : "bg-slate-800 text-slate-300"}`}>
                                            📚 إدارة الكورسات والأسعار
                                        </button>
                                    </div>

                                    {/* 1. نموذج إضافة حصة شاملة */}
                                    {adminTab === "lessons" && (
                                        <form onSubmit={handleAddComprehensiveLesson} className="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-7 space-y-6">
                                            <div className="border-b border-slate-800 pb-3">
                                                <h3 className="text-lg font-black text-cyan-400 flex items-center gap-2">
                                                    <span>➕</span><span>إضافة محاضرة جديدة متكاملة</span>
                                                </h3>
                                                <p className="text-xs text-slate-400">ستظهر المحاضرة فوراً للطلاب مع صورتها الخاصة والـ PDF وسؤال الاختبار.</p>
                                            </div>

                                            {/* البيانات الأساسية للحصة */}
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">1. الكورس التابعة له الحصة:</label>
                                                    <select
                                                        value={newLesson.courseId}
                                                        onChange={e => setNewLesson({ ...newLesson, courseId: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    >
                                                        {courses.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                                                    </select>
                                                </div>
                                                <div className="sm:col-span-2">
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">2. عنوان الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="مثال: الحصة 4: بناء أول نموذج ذكاء اصطناعي ببايثون"
                                                        value={newLesson.title}
                                                        onChange={e => setNewLesson({ ...newLesson, title: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">3. رابط فيديو يوتيوب (Unlisted):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://www.youtube.com/watch?v=..."
                                                        value={newLesson.videoUrl}
                                                        onChange={e => setNewLesson({ ...newLesson, videoUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">4. رابط ثامنيل الحصة (أو اتركه لجلب صورة يوتيوب تلقائياً):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://... رابط صورة الغلاف"
                                                        value={newLesson.thumbnail}
                                                        onChange={e => setNewLesson({ ...newLesson, thumbnail: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">5. سعر الحصة منفردة (ج.م):</label>
                                                    <input
                                                        type="number"
                                                        value={newLesson.price}
                                                        onChange={e => setNewLesson({ ...newLesson, price: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">6. رابط ملزمة الـ PDF (Google Drive):</label>
                                                    <input
                                                        type="text"
                                                        placeholder="https://drive.google.com/file/d/..."
                                                        value={newLesson.pdfUrl}
                                                        onChange={e => setNewLesson({ ...newLesson, pdfUrl: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1.5 font-bold">7. مدة الحصة:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="50 دقيقة"
                                                        value={newLesson.duration}
                                                        onChange={e => setNewLesson({ ...newLesson, duration: e.target.value })}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <div className="flex items-center gap-3 pt-6">
                                                    <input
                                                        type="checkbox"
                                                        id="comprehensiveFreeCheck"
                                                        checked={newLesson.isFree}
                                                        onChange={e => setNewLesson({ ...newLesson, isFree: e.target.checked })}
                                                        className="w-5 h-5 accent-cyan-500"
                                                    />
                                                    <label htmlFor="comprehensiveFreeCheck" className="text-sm font-bold text-slate-200 cursor-pointer">
                                                        حصة مجانية تجريبية مفتوحة للجميع بدون كود
                                                    </label>
                                                </div>
                                            </div>

                                            {/* قسم إضافة الاختبار التفاعلي الخاص بالحصة */}
                                            <div className="bg-slate-950/70 border border-slate-800 p-5 rounded-2xl space-y-4">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-amber-400 font-black">🧠</span>
                                                    <h4 className="font-bold text-sm text-amber-400">إضافة سؤال الاختبار التفاعلي للحصة (Quiz):</h4>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-1">نص السؤال:</label>
                                                    <input
                                                        type="text"
                                                        placeholder="مثال: ما هو الأمر المستخدم لطباعة نص في بايثون؟"
                                                        value={newLesson.quizQuestion}
                                                        onChange={e => setNewLesson({ ...newLesson, quizQuestion: e.target.value })}
                                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white"
                                                    />
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الأول (0):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="print()"
                                                            value={newLesson.quizOpt0}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt0: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الثاني (1):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="echo"
                                                            value={newLesson.quizOpt1}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt1: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] text-slate-400 mb-1">الخيار الثالث (2):</label>
                                                        <input
                                                            type="text"
                                                            placeholder="input()"
                                                            value={newLesson.quizOpt2}
                                                            onChange={e => setNewLesson({ ...newLesson, quizOpt2: e.target.value })}
                                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white"
                                                        />
                                                    </div>
                                                </div>
                                                <div className="w-full sm:w-1/3">
                                                    <label className="block text-[11px] text-emerald-400 mb-1 font-bold">الإجابة الصحيحة:</label>
                                                    <select
                                                        value={newLesson.correctOpt}
                                                        onChange={e => setNewLesson({ ...newLesson, correctOpt: Number(e.target.value) })}
                                                        className="w-full bg-slate-900 border border-emerald-500/50 text-emerald-300 font-bold rounded-xl px-3 py-2 text-xs"
                                                    >
                                                        <option value={0}>الخيار الأول هو الصحيح</option>
                                                        <option value={1}>الخيار الثاني هو الصحيح</option>
                                                        <option value={2}>الخيار الثالث هو الصحيح</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-2xl text-base shadow-xl shadow-cyan-500/20 transition flex items-center justify-center gap-2"
                                            >
                                                <span>🚀</span><span>نشر الحصة الجديدة وحفظها سحابياً لجميع الطلاب</span>
                                            </button>
                                        </form>
                                    )}

                                    {/* 2. توليد الأكواد */}
                                    {adminTab === "codes" && (
                                        <div className="space-y-6">
                                            <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">توليد أكواد لـ (كورس كامل أو حصة منفردة):</label>
                                                    <select
                                                        value={genTargetId}
                                                        onChange={e => setGenTargetId(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    >
                                                        <option value="ALL">🌟 كود شامل VIP يفتح كل المنصة</option>
                                                        <optgroup label="الكورسات الكاملة:">
                                                            {courses.map(c => <option key={c.id} value={c.id}>كورس: {c.title}</option>)}
                                                        </optgroup>
                                                        <optgroup label="الحصص المنفردة:">
                                                            {courses.flatMap(c => c.lessons.map(l => (
                                                                <option key={l.id} value={l.id}>حصة: {l.title} ({c.stage})</option>
                                                            )))}
                                                        </optgroup>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-xs text-slate-400 mb-2 font-bold">عدد الأكواد:</label>
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        max="100"
                                                        value={genCount}
                                                        onChange={e => setGenCount(e.target.value)}
                                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white"
                                                    />
                                                </div>
                                                <button
                                                    onClick={handleGenerateCodes}
                                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black py-2.5 px-4 rounded-xl text-sm transition"
                                                >
                                                    ⚡ توليد وحفظ سحابياً فوراً
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto border border-slate-800 rounded-2xl max-h-96">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-900 text-slate-400 sticky top-0 border-b border-slate-800">
                                                        <tr>
                                                            <th className="p-3.5">الكود</th>
                                                            <th className="p-3.5">المخصص له</th>
                                                            <th className="p-3.5">الحالة السحابية</th>
                                                            <th className="p-3.5">نسخ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-800/60">
                                                        {activationCodes.map((item, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-800/30">
                                                                <td className="p-3.5 font-mono font-bold text-cyan-400 text-base">{item.code}</td>
                                                                <td className="p-3.5 text-slate-300">
                                                                    {item.targetId === "ALL" ? "جميع الكورسات (VIP)" : item.targetId}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    {item.used ? (
                                                                        <span className="bg-rose-500/20 text-rose-300 text-xs px-2.5 py-1 rounded-full font-bold">مُستخدم (مقفل 🔒)</span>
                                                                    ) : (
                                                                        <span className="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-bold">متاح للإرسال ✅</span>
                                                                    )}
                                                                </td>
                                                                <td className="p-3.5">
                                                                    <button
                                                                        onClick={() => { navigator.clipboard.writeText(item.code); alert(`تم نسخ الكود: ${item.code}`); }}
                                                                        className="bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition"
                                                                    >
                                                                        نسخ 📋
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {/* 3. إدارة الكورسات وحصصها */}
                                    {adminTab === "courses" && (
                                        <div className="space-y-6">
                                            {courses.map(course => (
                                                <div key={course.id} className="bg-slate-900/90 border border-slate-800 p-5 rounded-2xl space-y-4">
                                                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-3">
                                                        <div className="flex items-center gap-3">
                                                            <img src={course.thumbnail} alt="" className="w-16 h-12 object-cover rounded-xl border border-slate-700" />
                                                            <div>
                                                                <h4 className="font-black text-white text-base">{course.title}</h4>
                                                                <p className="text-xs text-slate-400">{course.stage} • السعر: <span className="text-cyan-400 font-bold">{course.price} ج.م</span></p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button
                                                                onClick={() => {
                                                                    const p = prompt("أدخل السعر الجديد للكورس بالجنيه:", course.price);
                                                                    if (p !== null) {
                                                                        const updated = courses.map(c => c.id === course.id ? { ...c, price: Number(p) } : c);
                                                                        setCourses(updated);
                                                                        if (window.firebaseModules) {
                                                                            const { getFirestore, doc, updateDoc, initializeApp } = window.firebaseModules;
                                                                            const db = getFirestore(initializeApp(firebaseConfig));
                                                                            updateDoc(doc(db, "courses", course.id), { price: Number(p) });
                                                                        }
                                                                    }
                                                                }}
                                                                className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-white font-bold"
                                                            >
                                                                تعديل السعر 💰
                                                            </button>
                                                            <button
                                                                onClick={() => {
                                                                    const t = prompt("أدخل رابط صورة الثامنيل الجديدة للكورس:", course.thumbnail);
                                                                    if (t && t.trim()) {
                                                                        const updated = courses.map(c => c.id === course.id ? { ...c, thumbnail: t.trim() } : c);
                                                                        setCourses(updated);
                                                                        if (window.firebaseModules) {
                                                                            const { getFirestore, doc, updateDoc, initializeApp } = window.firebaseModules;
                                                                            const db = getFirestore(initializeApp(firebaseConfig));
                                                                            updateDoc(doc(db, "courses", course.id), { thumbnail: t.trim() });
                                                                        }
                                                                    }
                                                                }}
                                                                className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-xl text-white font-bold"
                                                            >
                                                                تغيير الثامنيل 🖼️
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* قائمة الحصص بداخل الكورس مع إمكانية حذف أي حصة */}
                                                    <div className="space-y-2">
                                                        <p className="text-xs text-slate-400 font-bold">الحصص المرفوعة داخل الكورس:</p>
                                                        {course.lessons.map((lesson, lIdx) => (
                                                            <div key={lesson.id} className="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 text-xs">
                                                                <div className="flex items-center gap-3">
                                                                    <img src={lesson.thumbnail || course.thumbnail} alt="" className="w-12 h-9 object-cover rounded-lg border border-slate-700" />
                                                                    <div>
                                                                        <p className="font-bold text-white">{lIdx + 1}. {lesson.title}</p>
                                                                        <span className="text-[11px] text-slate-400">⏱️ {lesson.duration} • 💰 منفردة: {lesson.price} ج.م {lesson.isFree && "• (مجانية)"}</span>
                                                                    </div>
                                                                </div>
                                                                <button
                                                                    onClick={() => handleDeleteLesson(course.id, lesson.id)}
                                                                    className="text-rose-400 hover:text-rose-300 font-bold px-2 py-1 bg-rose-500/10 rounded-lg transition"
                                                                >
                                                                    حذف 🗑️
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : activeCourse ? (
                            /* مشغل الحصة */
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                                <button onClick={() => { setActiveCourse(null); setActiveLesson(null); }} className="mb-6 inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-sm font-bold transition">
                                    <span>➡️</span><span>العودة لجميع الكورسات</span>
                                </button>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-2 space-y-6">
                                        {activeLesson && (activeLesson.isFree || isItemUnlocked(activeCourse.id, activeLesson.id)) ? (
                                            <div className="bg-cardBg border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-2xl space-y-5">
                                                <div className="video-wrapper shadow-2xl border border-slate-800">
                                                    <iframe
                                                        src={`https://www.youtube.com/embed/${activeLesson.videoId}?rel=0&modestbranding=1&enablejsapi=1`}
                                                        title={activeLesson.title}
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                                        referrerPolicy="strict-origin-when-cross-origin"
                                                        allowFullScreen
                                                    ></iframe>
                                                </div>
                                                <div className="flex flex-wrap items-center justify-between gap-4 pt-2 border-b border-slate-800 pb-4">
                                                    <div>
                                                        <span className="text-xs text-cyan-400 font-bold">{activeCourse.title}</span>
                                                        <h2 className="text-xl font-black text-white mt-1">{activeLesson.title}</h2>
                                                    </div>
                                                    <a href={activeLesson.pdfUrl} target="_blank" rel="noreferrer" className="bg-purple-600 hover:bg-purple-500 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-purple-600/25">
                                                        <span>📄</span><span>تحميل ملزمة الحصة PDF</span>
                                                    </a>
                                                </div>

                                                {/* سؤال الاختبار التفاعلي */}
                                                {activeLesson.quizQuestion && (
                                                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 space-y-3">
                                                        <h4 className="font-bold text-amber-400 text-sm flex items-center gap-2">
                                                            <span>🧠</span><span>سؤال تفاعلي سريع للحصة:</span>
                                                        </h4>
                                                        <p className="text-white font-semibold text-sm">{activeLesson.quizQuestion}</p>
                                                        <div className="space-y-2 pt-1">
                                                            {activeLesson.quizOptions.map((opt, i) => (
                                                                <button
                                                                    key={i}
                                                                    onClick={() => setQuizSelected(i)}
                                                                    className={`w-full text-right p-3 rounded-xl text-sm font-medium border transition flex items-center justify-between ${
                                                                        quizSelected === i
                                                                            ? i === activeLesson.correctOption
                                                                                ? "bg-emerald-500/20 border-emerald-500 text-emerald-300"
                                                                                : "bg-rose-500/20 border-rose-500 text-rose-300"
                                                                            : "bg-slate-800/70 border-slate-700/70 text-slate-300 hover:bg-slate-800"
                                                                    }`}
                                                                >
                                                                    <span>{opt}</span>
                                                                    {quizSelected === i && <span>{i === activeLesson.correctOption ? "✅ إجابة صحيحة!" : "❌ حاول مرة أخرى"}</span>}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            /* شاشة الحصة المقفولة */
                                            <div className="bg-cardBg border border-slate-800 rounded-3xl p-8 sm:p-12 text-center space-y-5 shadow-2xl">
                                                <div className="w-20 h-20 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-4xl mx-auto">🔒</div>
                                                <h3 className="text-2xl font-black text-white">هذه الحصة للمشتركين فقط</h3>
                                                <p className="text-slate-400 max-w-md mx-auto text-sm leading-relaxed">
                                                    يمكنك الاشتراك في الكورس كاملاً بسعر <strong>{activeCourse.price} ج.م</strong> أو فتح هذه الحصة منفردة بسعر <strong>{activeLesson?.price || 35} ج.م</strong>.
                                                </p>
                                                <div className="flex flex-wrap items-center justify-center gap-3">
                                                    <button onClick={() => { setTargetItemForCode(activeCourse); setShowPaymentModal(true); }} className="bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black px-6 py-3 rounded-2xl text-sm shadow-xl shadow-cyan-500/20 transition">
                                                        🔑 تفعيل الكورس كاملاً ({activeCourse.price} ج.م)
                                                    </button>
                                                    {activeLesson && (
                                                        <button onClick={() => { setTargetItemForCode(activeLesson); setShowPaymentModal(true); }} className="bg-slate-800 hover:bg-slate-700 text-white font-bold px-6 py-3 rounded-2xl text-sm border border-slate-700 transition">
                                                            🔑 تفعيل هذه الحصة فقط ({activeLesson.price} ج.م)
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* قائمة حصص الكورس مع صور الثامنيل الخاصة بها */}
                                    <div className="bg-cardBg border border-slate-800 rounded-3xl p-5 h-fit space-y-4">
                                        <div className="border-b border-slate-800 pb-4 flex items-center justify-between">
                                            <div>
                                                <h3 className="font-black text-lg text-white">محتوى الكورس</h3>
                                                <p className="text-xs text-slate-400">{activeCourse.lessons.length} حصص مسجلة بجودة عالية</p>
                                            </div>
                                        </div>
                                        <div className="space-y-2.5">
                                            {activeCourse.lessons.map((lesson, index) => {
                                                const unlocked = lesson.isFree || isItemUnlocked(activeCourse.id, lesson.id);
                                                const isCurrent = activeLesson && activeLesson.id === lesson.id;
                                                return (
                                                    <div
                                                        key={lesson.id}
                                                        onClick={() => { setActiveLesson(lesson); setQuizSelected(null); }}
                                                        className={`p-3 rounded-2xl border cursor-pointer transition flex items-center justify-between gap-3 ${
                                                            isCurrent ? "bg-cyan-500/15 border-cyan-500 text-white" : "bg-slate-900/70 border-slate-800/80 text-slate-300 hover:bg-slate-800/60"
                                                        }`}
                                                    >
                                                        <div className="flex items-center gap-3">
                                                            <img src={lesson.thumbnail || activeCourse.thumbnail} alt="" className="w-14 h-10 object-cover rounded-xl border border-slate-800 shrink-0" />
                                                            <div>
                                                                <p className="text-sm font-bold leading-snug line-clamp-1">{index + 1}. {lesson.title}</p>
                                                                <span className="text-[11px] text-slate-400">⏱️ {lesson.duration}</span>
                                                            </div>
                                                        </div>
                                                        <div className="shrink-0">
                                                            {lesson.isFree ? <span className="text-[11px] bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full font-bold">مجانية</span> : unlocked ? <span className="text-cyan-400">▶️</span> : <span className="text-slate-500">🔒</span>}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* واجهة الطلاب الرئيسية */
                            <div>
                                <section className="relative overflow-hidden py-14 sm:py-20 border-b border-slate-800/80">
                                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-6 relative z-10">
                                        <div className="inline-flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 px-4 py-1.5 rounded-full text-xs sm:text-sm text-cyan-300 font-bold">
                                            <span>🚀</span><span>منصة {SITE_CONFIG.instructorTitle} لتدريس البرمجة والذكاء الاصطناعي</span>
                                        </div>
                                        <h2 className="text-3xl sm:text-5xl lg:text-6xl font-black text-white leading-tight max-w-4xl mx-auto">
                                            افهم البرمجة والذكاء الاصطناعي صح.. وكون <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">مبرمج المستقبل</span>
                                        </h2>
                                        <p className="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base leading-relaxed">
                                            حصص مسجلة بأعلى جودة لطلاب الصف الأول الثانوي والصف الثاني الثانوي (نظام البكالوريا الجديد) ومعسكرات تأسيس البرمجة من الصفر.
                                        </p>
                                        <div className="flex flex-wrap items-center justify-center gap-4 pt-2">
                                            <a href="#courses-section" className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black px-7 py-3.5 rounded-2xl text-sm sm:text-base shadow-xl shadow-cyan-500/20 transition">
                                                📚 تصفح الكورسات والحصص المجانية
                                            </a>
                                            <button onClick={() => { setTargetItemForCode(null); setShowPaymentModal(true); }} className="bg-slate-800/90 hover:bg-slate-700 text-white border border-slate-700 font-bold px-6 py-3.5 rounded-2xl text-sm sm:text-base transition">
                                                🔑 تفعيل كود الاشتراك
                                            </button>
                                        </div>
                                    </div>
                                </section>

                                <section id="courses-section" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14 space-y-8">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div>
                                            <h3 className="text-2xl font-black text-white">الكورسات المتاحة بالمنصة</h3>
                                            <p className="text-sm text-slate-400">شاهد الحصة الأولى من أي كورس مجاناً قبل الاشتراك</p>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {["الكل", "الصف الأول الثانوي", "الصف الثاني الثانوي - بكالوريا", "تأسيس البرمجة"].map(stage => (
                                                <button key={stage} onClick={() => setSelectedStage(stage)} className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${selectedStage === stage ? "bg-cyan-500 text-slate-950" : "bg-cardBg text-slate-300 border border-slate-800"}`}>
                                                    {stage}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">
                                        {filteredCourses.map(course => {
                                            const unlocked = isItemUnlocked(course.id);
                                            return (
                                                <div key={course.id} className="bg-cardBg border border-slate-800/90 hover:border-cyan-500/50 rounded-3xl overflow-hidden flex flex-col justify-between transition duration-300 shadow-xl group">
                                                    <div>
                                                        <div className="relative h-52 overflow-hidden bg-slate-900">
                                                            <img src={course.thumbnail} alt={course.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                                                            <div className="absolute top-3 right-3 bg-slate-950/85 backdrop-blur-md text-cyan-300 border border-cyan-500/30 text-xs font-bold px-3 py-1 rounded-full">
                                                                {course.badge}
                                                            </div>
                                                            <div className="absolute bottom-3 left-3 bg-slate-950/90 text-white text-xs font-black px-3 py-1.5 rounded-xl border border-slate-700">
                                                                {course.price} ج.م
                                                            </div>
                                                        </div>
                                                        <div className="p-6 space-y-3">
                                                            <span className="text-xs font-bold text-purple-400">{course.stage}</span>
                                                            <h4 className="text-lg font-black text-white leading-snug">{course.title}</h4>
                                                            <p className="text-xs text-slate-400 leading-relaxed">{course.description}</p>
                                                        </div>
                                                    </div>

                                                    <div className="px-6 pb-6 pt-2 space-y-3">
                                                        <div className="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-3">
                                                            <span>🎬 {course.lessons.length} حصص</span>
                                                            <span>📄 شاملة الملازم والـ PDF</span>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-2.5">
                                                            <button onClick={() => { setActiveCourse(course); setActiveLesson(course.lessons[0] || null); }} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs sm:text-sm transition">
                                                                ▶️ {unlocked ? "دخول الكورس" : "الحصة 1 مجاناً"}
                                                            </button>
                                                            {unlocked ? (
                                                                <div className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 font-bold py-2.5 px-3 rounded-xl text-xs sm:text-sm flex items-center justify-center">
                                                                    مُفعّل لديك ✅
                                                                </div>
                                                            ) : (
                                                                <button onClick={() => { setTargetItemForCode(course); setShowPaymentModal(true); }} className="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-2.5 px-3 rounded-xl text-xs sm:text-sm transition">
                                                                    🔑 تفعيل الكود
                                                                </button>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {/* نافذة الدفع وتفعيل الكود */}
                    {showPaymentModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-cardBg border border-slate-700 rounded-3xl max-w-md w-full p-6 sm:p-7 space-y-5 shadow-2xl relative">
                                <button onClick={() => { setShowPaymentModal(false); setCodeMessage({ type: "", text: "" }); }} className="absolute top-5 left-5 text-slate-400 hover:text-white text-xl">✕</button>
                                <div>
                                    <span className="text-xs bg-cyan-500/20 text-cyan-300 px-3 py-1 rounded-full font-bold">تفعيل فوري سحابي ☁️</span>
                                    <h3 className="text-xl font-black text-white mt-2">
                                        {targetItemForCode ? `تفعيل: ${targetItemForCode.title}` : "تفعيل كود الاشتراك"}
                                    </h3>
                                </div>
                                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 space-y-2.5 text-xs sm:text-sm">
                                    <p className="font-bold text-amber-400">📲 خطوات استلام الكود:</p>
                                    <ol className="list-decimal list-inside space-y-1.5 text-slate-300">
                                        <li>
                                            حول المبلغ {targetItemForCode ? `(${targetItemForCode.price} ج.م)` : ""} فودافون كاش أو انستا باي على:{" "}
                                            <span className="font-mono font-bold text-cyan-400 select-all">{SITE_CONFIG.vodafoneCashNumber}</span>
                                        </li>
                                        <li>أرسل صورة التحويل على واتساب لاستلام الكود فوراً.</li>
                                    </ol>
                                    <a
                                        href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${encodeURIComponent(`السلام عليكم يا بشمهندس منصور، حولت اشتراك (${targetItemForCode ? targetItemForCode.title : "المنصة"}) وعايز أستلم كود التفعيل.`)}`}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="mt-2 w-full bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/30 font-bold py-2 rounded-xl flex items-center justify-center gap-2 transition"
                                    >
                                        <span>💬</span><span>إرسال إيصال التحويل على واتساب</span>
                                    </a>
                                </div>

                                <form onSubmit={handleActivateCode} className="space-y-3 pt-1">
                                    <label className="block text-xs font-bold text-slate-300">أدخل كود التفعيل المكون من حروف وأرقام:</label>
                                    <input
                                        type="text"
                                        placeholder="مثال: SEC1-48291"
                                        value={codeInput}
                                        onChange={(e) => setCodeInput(e.target.value)}
                                        className="w-full bg-slate-900 border border-slate-700 focus:border-cyan-500 rounded-xl px-4 py-3 text-center font-mono text-base font-bold text-white uppercase tracking-widest focus:outline-none"
                                    />
                                    {codeMessage.text && (
                                        <p className={`text-xs font-bold p-3 rounded-xl text-center ${codeMessage.type === "success" ? "bg-emerald-500/20 text-emerald-300" : "bg-rose-500/20 text-rose-300"}`}>
                                            {codeMessage.text}
                                        </p>
                                    )}
                                    <button
                                        type="submit"
                                        disabled={isFirebaseSyncing}
                                        className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg shadow-cyan-500/20 transition flex items-center justify-center gap-2"
                                    >
                                        {isFirebaseSyncing ? "جاري التحقق من السحابة..." : "🚀 تفعيل المحتوى الآن"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* نافذة الأدمن */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-cardBg border border-slate-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                                <button onClick={() => { setShowAdminLogin(false); setPinInput(""); }} className="absolute top-4 left-4 text-slate-400 hover:text-white">✕</button>
                                <h3 className="text-lg font-black text-white">🔒 دخول إدارة المنصة</h3>
                                <p className="text-xs text-slate-400">خاصة بالمهندس منصور فقط لإدارة الأكواد والحصص.</p>
                                <input
                                    type="password"
                                    placeholder="أدخل كلمة المرور السرية"
                                    value={pinInput}
                                    onChange={(e) => setPinInput(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white"
                                />
                                <button
                                    onClick={() => {
                                        if (pinInput === SITE_CONFIG.defaultAdminPin) {
                                            setIsAdminAuthenticated(true);
                                            setShowAdminLogin(false);
                                            setPinInput("");
                                        } else {
                                            alert("كلمة المرور غير صحيحة!");
                                        }
                                    }}
                                    className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-sm transition"
                                >
                                    دخول لوحة التحكم
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="border-t border-slate-800/80 bg-[#080B12] py-8 mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
                            <p>© 2026 جميع الحقوق محفوظة — منصة <strong>{SITE_CONFIG.platformName}</strong></p>
                            <div className="flex items-center gap-4">
                                <a href={SITE_CONFIG.youtubeChannelUrl} target="_blank" rel="noreferrer" className="hover:text-cyan-400 transition">
                                    قناة يوتيوب
                                </a>
                                <span>•</span>
                                <button onClick={() => setShowAdminLogin(true)} className="text-slate-600 hover:text-slate-400 transition">
                                    دخول الإدارة 🔒
                                </button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
